title:{ar:'أحاديث في فضل المرض والمصائب والصبر عليها',ur:'بیماری، مصائب اور صبر کی فضیلت',fa:'احادیث در فضل بیماری و صبر',en:'Virtue of Illness, Trials & Patience',fr:'Vertu de la maladie et patience',hi:'बीमारी और सब्र की फ़ज़ीलत',bn:'রোগ ও ধৈর্যের ফযিলত',id:'Keutamaan Sakit dan Sabar',ms:'Kelebihan Sakit dan Sabar',tr:'Hastalık ve Sabır Fazileti'},
blocks:[
{type:'i',text:{ar:'أخي المريض: هذه الباقة العطرة من الأحاديث النبوية الصحيحة تدل على عظم أجرك عند الله، إن أنت صبرت على مرضك وقابلت قدر الله تعالى بالتسليم والرضا لا بالجزع والتسخط والتشكي.',en:'Dear patient: These fragrant authentic hadiths show the greatness of your reward with Allah — if you are patient with your illness and accept Allah\'s decree with submission and contentment, not with distress or complaint.',ur:'اخی المریض: یہ احادیث نبوی کا معطر گلدستہ آپ کے اللہ کے ہاں عظیم اجر کی دلیل ہے — اگر صبر کریں اور اللہ کے فیصلے کو رضا سے قبول کریں، بے چینی اور شکایت سے نہیں۔',fa:'برادر بیمار: این دسته گل احادیث صحیح نشان‌دهنده عظمت اجر توست نزد الله — اگر بر بیماری صبر کنی و قضای الهی را با تسلیم و رضا بپذیری.',fr:'Cher malade: Ces hadiths authentiques témoignent de ta grande récompense auprès d\'Allah, si tu es patient et acceptes le décret d\'Allah avec soumission et contentement.',hi:'प्रिय मरीज़: ये सहीह हदीसें आपके अल्लाह के पास अज़ीम अज्र की दलील हैं — बशर्ते सब्र करें और अल्लाह की तक़दीर रज़ा से क़बूल करें।',bn:'প্রিয় রোগী: এই সহীহ হাদীসগুলো আল্লাহর কাছে বিশাল পুরস্কার প্রমাণ করে — যদি ধৈর্য ধরেন ও সন্তুষ্টচিত্তে মেনে নেন।',id:'Saudara yang sakit: Hadits-hadits sahih ini menunjukkan besarnya pahalamu di sisi Allah — jika bersabar dan menerima takdir Allah dengan kerelaan.',ms:'Saudara yang sakit: Hadith-hadith sahih ini menunjukkan besarnya pahalamu di sisi Allah — jika bersabar dan menerima ketentuan Allah dengan kerelaan.',tr:'Sevgili hasta: Bu sahih hadisler, hastalığına sabredersen Allah katındaki büyük ecrine işaret eder.'}},
{type:'h',text:{ar:'١ ـ عن أبي هريرة وأبي سعيد الخدري رضي الله عنهما، عن النبي ﷺ قال: «ما يصيب المسلم من نَصَبٍ، ولا وصب، ولا هم، ولا حزن، ولا أذى ولا غم، حتى الشوكة يشاكها إلا كفر الله بها من خطاياه» [متفق عليه، واللفظ للبخاري] والنصب التعب والوصب: المرض.',en:'1. From Abu Hurairah and Abu Sa\'id al-Khudri (may Allah be pleased with them both), from the Prophet ﷺ, who said: "No fatigue, illness, worry, grief, hurt or distress befalls a Muslim — even the prick of a thorn — except that Allah expiates his sins through it." [Agreed upon; wording is al-Bukhari\'s] (An-nasab = fatigue; Al-wasab = illness)',ur:'١۔ ابو ہریرہ اور ابو سعید خدری رضی اللہ عنہما سے روایت ہے، نبی ﷺ سے، آپ نے فرمایا: «مسلمان کو جو تھکان، بیماری، فکر، غم، تکلیف، رنج — یہاں تک کہ کانٹا چبھنا — اللہ اس سے گناہ مٹا دیتا ہے» [متفق علیہ، اللفظ للبخاری]۔ (النصب: تھکاوٹ، الوصب: بیماری)',fa:'١. از ابوهریره و ابوسعید خدری (رضی‌الله‌عنهما)، از پیامبر ﷺ، فرمود: «هیچ خستگی، بیماری، غم، اندوه، آزار و رنجی — حتی خار — به مسلمان نمی‌رسد مگر الله گناهانش را می‌آمرزد» [متفق علیه، لفظ بخاری]. (النصب: خستگی؛ الوصب: بیماری)',fr:'1. D\'Abu Hurairah et Abu Sa\'id al-Khudri (qu\'Allah les agrée), d\'après le Prophète ﷺ qui dit: «Aucune fatigue, maladie, souci, tristesse, dommage ou peine n\'atteint le Musulman — même la piqûre d\'une épine — sans qu\'Allah n\'expie ses péchés par cela.» [Muttafaqun \'alayh; formulation al-Bukhari] (An-nasab = fatigue; Al-wasab = maladie)',hi:'१. अबू हुरैरा और अबू सईद खुदरी (रज़ियल्लाहु अन्हुमा) से, नबी ﷺ से रिवायत है, आपने फ़रमाया: «मुसलमान को जो थकान, बीमारी, चिंता, दुख, तकलीफ़ — यहाँ तक कि काँटा चुभना — अल्लाह उससे गुनाह मिटा देता है» [मुत्तफ़क़ अलैह, लफ़्ज़ बुख़ारी का]। (अन-नसब: थकान; अल-वसब: बीमारी)',bn:'১. আবু হুরায়রা ও আবু সাঈদ আল-খুদরী (রাযিয়াল্লাহু আনহুমা) থেকে, নবী ﷺ থেকে, তিনি বলেন: «মুসলিমকে যে ক্লান্তি, রোগ, চিন্তা, দুঃখ, কষ্ট — এমনকি কাঁটার আঘাত — আল্লাহ তার মাধ্যমে গুনাহ মোচন করেন» [মুত্তাফাকুন আলাইহি; শব্দ বুখারীর]। (আন-নাসাব: ক্লান্তি; আল-ওয়াসাব: রোগ)',id:'1. Dari Abu Hurairah dan Abu Sa\'id al-Khudri (radhiyallahu \'anhuma), dari Nabi ﷺ, beliau bersabda: "Tidaklah kelelahan, penyakit, kekhawatiran, kesedihan, gangguan atau kesusahan menimpa seorang Muslim — bahkan duri yang menusuknya — melainkan Allah menghapus dosanya karena itu." [Muttafaq \'alaih; lafaz al-Bukhari] (An-nasab = kelelahan; Al-wasab = penyakit)',ms:'1. Daripada Abu Hurairah dan Abu Sa\'id al-Khudri (radhiyallahu \'anhuma), daripada Nabi ﷺ, baginda bersabda: "Tidaklah kepenat, penyakit, kebimbangan, kesedihan, kesakitan — bahkan tusukan duri — menimpa seorang Muslim melainkan Allah menghapuskan dosanya dengan itu." [Muttafaq \'alaih; lafaz al-Bukhari] (An-nasab = penat; Al-wasab = penyakit)',tr:'1. Ebû Hüreyre ve Ebû Saîd el-Hudrî\'den (radıyallahu anhümâ), Peygamber ﷺ\'den rivayet edilir, şöyle buyurdu: "Bir Müslümana isabet eden hiçbir yorgunluk, hastalık, tasa, üzüntü, eziyet — hatta batan bir diken bile — olmaz ki Allah onunla günahlarını silmesin." [Müttefekun aleyh; lafız Buhârî\'ye aittir] (En-nasab = yorgunluk; El-vasab = hastalık)'}},
{type:'h',text:{ar:'٢ ـ وعن ابن مسعود رضي الله عنه قال: قال رسول الله ﷺ «هما من مسلم يصيبه أذى من مرض فما سواه إلا حط الله به من سيئاته كما تحط الشجرة ورقها» [متفق عليه].',en:'2. From Ibn Mas\'ud (may Allah be pleased with him), who said: The Messenger of Allah ﷺ said: "No Muslim is harmed by illness or anything else except that Allah drops his sins because of it, as a tree sheds its leaves." [Agreed upon]',ur:'٢۔ ابن مسعود رضی اللہ عنہ سے روایت ہے، انہوں نے کہا: رسول اللہ ﷺ نے فرمایا: «جو مسلمان بیماری یا کسی بھی تکلیف سے متاثر ہو، اللہ گناہ جھاڑ دیتا ہے جیسے درخت پتے جھاڑتا ہے» [متفق علیہ]۔',fa:'٢. از ابن مسعود (رضی‌الله‌عنه)، گفت: رسول الله ﷺ فرمود: «هر مسلمانی از بیماری یا چیز دیگری آسیب ببیند، الله گناهانش را می‌ریزد مثل درخت که برگ می‌ریزد» [متفق علیه].',fr:'2. D\'Ibn Mas\'ud (qu\'Allah l\'agrée), qui dit: Le Messager d\'Allah ﷺ dit: «Nul Muslim blessé par maladie ou autre chose sans qu\'Allah fasse tomber ses péchés, comme un arbre perd ses feuilles.» [Muttafaqun \'alayh]',hi:'२. इब्न मसऊद (रज़ियल्लाहु अन्हु) से, उन्होंने कहा: रसूलुल्लाह ﷺ ने फ़रमाया: «जो मुसलमान बीमारी या किसी भी तकलीफ़ से पीड़ित हो, अल्लाह गुनाह झाड़ता है जैसे पेड़ पत्ते झाड़ता है» [मुत्तफ़क़ अलैह]।',bn:'২. ইবনে মাসউদ (রাযিয়াল্লাহু আনহু) থেকে, তিনি বলেন: রাসূলুল্লাহ ﷺ বলেছেন: «বিমার বা যেকোনো কষ্টে পীড়িত মুসলিমের গুনাহ ঝরে পড়ে যেমন গাছের পাতা ঝরে» [মুত্তাফাকুন আলাইহি]।',id:'2. Dari Ibnu Mas\'ud (radhiyallahu \'anhu), ia berkata: Rasulullah ﷺ bersabda: "Tidaklah seorang Muslim ditimpa penyakit atau hal lainnya melainkan Allah menggugurkan dosanya karena itu, seperti pohon menggugurkan daunnya." [Muttafaq \'alaih]',ms:'2. Daripada Ibnu Mas\'ud (radhiyallahu \'anhu), beliau berkata: Rasulullah ﷺ bersabda: "Tidaklah seorang Muslim ditimpa penyakit atau apa sahaja melainkan Allah gugurkan dosanya, seperti pokok menggugurkan daunnya." [Muttafaq \'alaih]',tr:'2. İbn Mes\'ûd\'dan (radıyallahu anh) rivayet edilir, dedi ki: Rasûlullah ﷺ buyurdu: "Hastalık veya başka bir şeyle zarar gören hiçbir Müslüman yoktur ki Allah günahlarını ağacın yaprak döktüğü gibi dökmesin." [Müttefekun aleyh]'}},
{type:'h',text:{ar:'٣ ـ وعن عائشة رضي الله عنها قالت: قال رسول الله ﷺ: «ما من مصيبة تصيب المسلم إلا كفر الله بها عنه، حتى الشوكة يشاكها» [متفق عليه].',en:'3. From Aisha (may Allah be pleased with her), who said: The Messenger of Allah ﷺ said: "No affliction befalls a Muslim except that Allah expiates his sins through it — even the prick of a thorn." [Agreed upon]',ur:'٣۔ عائشہ رضی اللہ عنہا سے روایت ہے، انہوں نے کہا: رسول اللہ ﷺ نے فرمایا: «مسلمان کو جو بھی مصیبت آئے اللہ اس سے گناہ معاف کرتا ہے — یہاں تک کہ کانٹا چبھنا بھی» [متفق علیہ]۔',fa:'٣. از عائشه (رضی‌الله‌عنها)، گفت: رسول الله ﷺ فرمود: «هیچ مصیبتی به مسلمان نمی‌رسد مگر الله به آن گناهش را می‌بخشد — حتی خاری که او را بزند» [متفق علیه].',fr:'3. D\'Aïcha (qu\'Allah l\'agrée), qui dit: Le Messager d\'Allah ﷺ dit: «Toute affliction qui touche le Muslim est expiation — même la piqûre d\'une épine.» [Muttafaqun \'alayh]',hi:'३. आयशा (रज़ियल्लाहु अन्हा) से, उन्होंने कहा: रसूलुल्लाह ﷺ ने फ़रमाया: «मुसलमान को जो मुसीबत आए अल्लाह उससे गुनाह माफ़ करता है — यहाँ तक कि काँटा चुभना भी» [मुत्तफ़क़ अलैह]।',bn:'৩. আয়িশা (রাযিয়াল্লাহু আনহা) থেকে, তিনি বলেন: রাসূলুল্লাহ ﷺ বলেছেন: «মুসলিমকে যে কোনো বিপদেই হোক আল্লাহ সে কারণে গুনাহ মাফ করেন — এমনকি কাঁটার আঘাতেও» [মুত্তাফাকুন আলাইহি]।',id:'3. Dari Aisha (radhiyallahu \'anha), ia berkata: Rasulullah ﷺ bersabda: "Tidak ada musibah yang menimpa Muslim kecuali Allah mengampuni dosanya melaluinya — bahkan tusukan duri." [Muttafaq \'alaih]',ms:'3. Daripada Aishah (radhiyallahu \'anha), beliau berkata: Rasulullah ﷺ bersabda: "Tidak ada musibah yang menimpa Muslim melainkan Allah mengampuni dosanya dengannya — bahkan duri pun." [Muttafaq \'alaih]',tr:'3. Aişe\'den (radıyallahu anhâ) rivayet edilir, dedi ki: Rasûlullah ﷺ buyurdu: "Müslümana isabet eden hiçbir musibet yoktur ki Allah onunla günahını bağışlamasın — hatta batan diken bile." [Müttefekun aleyh]'}},
{type:'h',text:{ar:'٤ ـ وعن أبي هريرة رضي الله عنه: لما نزلت: ﴿مَن يَعمَل سُوءاً يُجزَ بِهِ﴾ [النساء: ١٢٣] بلغت من المسلمين مبلغاً شديداً، فقال رسول الله ﷺ: «قاربوا وسددوا، ففي ما يصاب به المسلم كفارة حتى النكبة ينكبها، أو الشوكة يشاكها» [مسلم].',en:'4. From Abu Hurairah (may Allah be pleased with him): When the verse [4:123] — "Whoever does evil will be recompensed for it" — was revealed, it profoundly affected the Muslims. The Messenger of Allah ﷺ then said: "Be moderate and upright; for what befalls the Muslim is an expiation — even a stumble or the prick of a thorn." [Muslim]',ur:'٤۔ ابو ہریرہ رضی اللہ عنہ سے روایت ہے: جب آیت ﴿مَن يَعمَل سُوءاً يُجزَ بِهِ﴾ [النساء: ١٢٣] نازل ہوئی تو مسلمانوں پر بہت شدید اثر پڑا۔ رسول اللہ ﷺ نے فرمایا: «میانہ روی اختیار کرو اور سیدھے رہو — مسلمان کو جو بھی تکلیف ہو، یہاں تک کہ ٹھوکر لگنا یا کانٹا چبھنا، وہ کفارہ ہے» [مسلم]۔',fa:'٤. از ابوهریره (رضی‌الله‌عنه): وقتی آیه ﴿مَن يَعمَل سُوءاً يُجزَ بِهِ﴾ [نساء: ١٢٣] نازل شد، مسلمانان را به‌شدت آشفت. رسول الله ﷺ فرمود: «میانه‌روی کنید و راست باشید — آنچه مسلمان بدان گرفتار شود کفاره است حتی سنگ به پای خوردن یا خار خوردن» [مسلم].',fr:'4. D\'Abu Hurairah (qu\'Allah l\'agrée): À la révélation de [4:123] — «Quiconque fait le mal en sera récompensé» — elle affecta profondément les Musulmans. Le Messager d\'Allah ﷺ dit alors: «Soyez modérés et droits; ce qui afflige le Muslim est une expiation — même un faux pas ou la piqûre d\'une épine.» [Muslim]',hi:'४. अबू हुरैरा (रज़ियल्लाहु अन्हु) से: जब आयत ﴿مَن يَعمَل سُوءاً يُجزَ بِهِ﴾ [निसा: १२३] नाज़िल हुई तो मुसलमानों पर बहुत गहरा असर हुआ। रसूलुल्लाह ﷺ ने फ़रमाया: «मीयाना रवी अपनाओ और सीधे रहो — मुसलमान को जो भी तकलीफ़ हो, यहाँ तक कि ठोकर या काँटा, वो कफ़्फ़ारा है» [मुस्लिम]।',bn:'৪. আবু হুরায়রা (রাযিয়াল্লাহু আনহু) থেকে: যখন আয়াত ﴿مَن يَعمَل سُوءاً يُجزَ بِهِ﴾ [নিসা: ১২৩] নাযিল হলো তখন মুসলিমদের মধ্যে ব্যাপক প্রভাব পড়ল। রাসূলুল্লাহ ﷺ বললেন: «মধ্যমপন্থী হও ও সঠিক থাকো — মুসলিমের যে কষ্ট হয়, এমনকি হোঁচট বা কাঁটার আঘাত, তা কাফফারা» [মুসলিম]।',id:'4. Dari Abu Hurairah (radhiyallahu \'anhu): Ketika [4:123] — "Barang siapa yang berbuat keburukan akan dibalas karenanya" — diturunkan, ia sangat mempengaruhi kaum Muslimin. Rasulullah ﷺ lalu bersabda: "Berlaku moderat dan luruslah; apa yang menimpa Muslim adalah kafarat — bahkan tersandung atau tertusuk duri." [Muslim]',ms:'4. Daripada Abu Hurairah (radhiyallahu \'anhu): Ketika [4:123] — "Sesiapa yang berbuat kejahatan akan dibalasnya" — diturunkan, ia sangat mempengaruhi kaum Muslimin. Rasulullah ﷺ kemudian bersabda: "Berlaku sederhana dan luruslah; apa yang menimpa Muslim adalah kafarat — bahkan tersepak atau tertusuk duri." [Muslim]',tr:'4. Ebû Hüreyre\'den (radıyallahu anh): [4:123] — "Kim bir kötülük yaparsa onunla cezalandırılır" — indiğinde Müslümanları derinden etkiledi. Rasûlullah ﷺ şöyle buyurdu: "Orta yolu tutun ve doğru olun; Müslümana isabet eden keffaret olur — hatta tökezlemek veya diken bile." [Müslim]'}},
{type:'h',text:{ar:'٥ ـ وعن جابر بن عبد الله رضي الله عنه أن رسول الله ﷺ دخل على أم السائب فقال: «ما لكِ يا أم السائب تزفزفين؟» قالت: الحمى لا بارك الله فيها. فقال: «لا تسبي الحمى، فإنها تذهب خطايا بني آدم كما يذهب الكير خبث الحديد» [مسلم] ومعنى تزفزفين: ترتعدين.',en:'5. From Jabir ibn Abdillah (may Allah be pleased with him): The Messenger of Allah ﷺ entered upon Umm al-Sa\'ib and said: "What is the matter with you, O Umm al-Sa\'ib — why are you shivering?" She said: "It is the fever — may Allah not bless it!" He said: "Do not curse fever; for it removes the sins of Adam\'s children as a furnace removes the impurity of iron." [Muslim] (Tuzafzifin = you are shivering)',ur:'٥۔ جابر بن عبد اللہ رضی اللہ عنہ سے روایت ہے کہ رسول اللہ ﷺ ام السائب کے پاس تشریف لے گئے اور فرمایا: «تجھے کیا ہوا، اے ام السائب، کیوں کانپ رہی ہو؟» انہوں نے کہا: بخار ہے، اللہ اسے برکت نہ دے۔ آپ نے فرمایا: «بخار کو گالی مت دو، یہ گناہ دور کرتا ہے جیسے بھٹی لوہے کا میل» [مسلم]۔ (تزفزفین: کانپنا)',fa:'٥. از جابر بن عبدالله (رضی‌الله‌عنه): رسول الله ﷺ بر ام‌السائب وارد شد و فرمود: «چه شده، ای ام‌السائب؟ چرا می‌لرزی؟» گفت: تب است، الله برکتش ندهد! فرمود: «به تب بد نگو، زیرا گناهان بنی‌آدم را می‌برد همان‌طور که کوره پالایه آهن را» [مسلم]. (تزفزفین: می‌لرزی)',fr:'5. De Jabir ibn Abdillah (qu\'Allah l\'agrée): Le Messager d\'Allah ﷺ rendit visite à Umm al-Sa\'ib et dit: «Qu\'as-tu, O Umm al-Sa\'ib — pourquoi frissonnes-tu?» Elle dit: «C\'est la fièvre — qu\'Allah ne la bénisse pas!» Il dit: «Ne maudis pas la fièvre; elle efface les péchés des fils d\'Adam comme la soufflerie enlève les impuretés du fer.» [Muslim] (Tuzafzifin = tu frissonnes)',hi:'५. जाबिर बिन अब्दुल्लाह (रज़ियल्लाहु अन्हु) से: रसूलुल्लाह ﷺ उम्मुस्साइब के पास तशरीफ लाए और फ़रमाया: «तुम्हें क्या हुआ, ओ उम्मुस्साइब, क्यों काँप रही हो?» उन्होंने कहा: बुखार है, अल्लाह इसे बरकत न दे! आपने फ़रमाया: «बुखार को गाली मत दो, यह गुनाह दूर करता है जैसे भट्टी लोहे का मैल» [मुस्लिम]। (तुज़फ़्ज़िफ़ीन: काँपना)',bn:'৫. জাবির ইবনে আবদুল্লাহ (রাযিয়াল্লাহু আনহু) থেকে: রাসূলুল্লাহ ﷺ উম্মুস-সায়িবের কাছে গেলেন এবং বললেন: «তোমার কী হয়েছে, হে উম্মুস-সায়িব — কেন কাঁপছো?» তিনি বললেন: জ্বর, আল্লাহ এতে বরকত না দিক! তিনি বললেন: «জ্বরকে গালি দিও না; এটি আদম সন্তানের গুনাহ দূর করে যেমন হাপর লোহার ময়লা দূর করে» [মুসলিম]। (তুযাফযিফীন: কাঁপছ)',id:'5. Dari Jabir ibn Abdillah (radhiyallahu \'anhu): Rasulullah ﷺ masuk menemui Umm al-Sa\'ib dan berkata: "Ada apa, wahai Umm al-Sa\'ib — mengapa kamu menggigil?" Ia menjawab: "Demam, semoga Allah tidak memberkatinya!" Beliau bersabda: "Jangan mencela demam; ia menghapus dosa-dosa keturunan Adam seperti tungku memurnikan kotoran besi." [Muslim] (Tuzafzifin = menggigil)',ms:'5. Daripada Jabir ibn Abdillah (radhiyallahu \'anhu): Rasulullah ﷺ masuk menemui Umm al-Sa\'ib dan berkata: "Apa yang terjadi, wahai Umm al-Sa\'ib — mengapa kamu menggigil?" Dia menjawab: "Demam, semoga Allah tidak memberkatinya!" Baginda bersabda: "Jangan maki demam; ia menghapus dosa-dosa anak Adam seperti relau memurnikan kotoran besi." [Muslim] (Tuzafzifin = menggigil)',tr:'5. Câbir ibn Abdillah\'tan (radıyallahu anh): Rasûlullah ﷺ Ümmü\'s-Sâib\'in yanına girdi ve dedi: "Ne oldu sana, ey Ümmü\'s-Sâib — neden titiriyorsun?" O dedi: "Ateş — Allah onu bereketlendirmesin!" Şöyle buyurdu: "Ateşe sövme; o, Âdemoğullarının günahlarını, körüğün demirin pasını giderdiği gibi giderir." [Müslim] (Tuzafzifin = titriyorsun)'}},
{type:'h',text:{ar:'٦ ـ وعن أم العلاء رضي الله عنها قالت: عادني رسول الله ﷺ وأنا مريضة فقال: «أبشري يا أم العلاء، فإن مرض المسلم يذهب الله به خطاياه، كما تذهب النار خبث الذهب والفضة» [أبو داود وحسنه المنذري].',en:'6. From Umm al-\'Ala (may Allah be pleased with her), who said: The Messenger of Allah ﷺ visited me while I was sick and said: "Rejoice, O Umm al-\'Ala! For Allah removes a Muslim\'s sins through illness, as fire removes impurities from gold and silver." [Abu Dawud; authenticated by al-Mundhiri]',ur:'٦۔ ام العلاء رضی اللہ عنہا سے روایت ہے، انہوں نے کہا: رسول اللہ ﷺ میری عیادت کو تشریف لائے جبکہ میں بیمار تھی، آپ نے فرمایا: «خوش ہو جاؤ اے ام العلاء! مسلمان کی بیماری سے اللہ گناہ دور کرتا ہے جیسے آگ سونے چاندی کی کثافت» [ابو داود، حسنہ المنذری]۔',fa:'٦. از ام‌العلاء (رضی‌الله‌عنها)، گفت: رسول الله ﷺ در حالی که بیمار بودم به عیادتم آمد و فرمود: «مژده باد تو را ای ام‌العلاء! بیماری مسلمان گناهانش را می‌برد، همان‌طور که آتش ناخالصی طلا و نقره را» [ابوداود؛ المنذری آن را حسن شمرده].',fr:'6. D\'Umm al-\'Ala (qu\'Allah l\'agrée), qui dit: Le Messager d\'Allah ﷺ me rendit visite alors que j\'étais malade et dit: «Réjouis-toi, O Umm al-\'Ala! La maladie du Muslim efface ses péchés, comme le feu purifie l\'or et l\'argent.» [Abu Dawud; jugé bon par al-Mundhiri]',hi:'६. उम्मुल अला (रज़ियल्लाहु अन्हा) से, उन्होंने कहा: रसूलुल्लाह ﷺ मेरी अयादत को तशरीफ लाए जबकि मैं बीमार थी और फ़रमाया: «खुश हो जाओ ओ उम्मुल अला! मुसलमान की बीमारी से अल्लाह गुनाह दूर करता है जैसे आग सोने चाँदी की कचास» [अबू दाऊद; मुंज़िरी ने हसन कहा]।',bn:'৬. উম্মুল আলা (রাযিয়াল্লাহু আনহা) থেকে, তিনি বলেন: রাসূলুল্লাহ ﷺ আমার কাছে আমার অসুস্থ অবস্থায় এসেছিলেন এবং বললেন: «সুসংবাদ নাও হে উম্মুল আলা! মুসলিমের রোগ দিয়ে আল্লাহ গুনাহ দূর করেন যেমন আগুন সোনা-রূপার ময়লা» [আবু দাউদ; মুনযিরী হাসান বলেছেন]।',id:'6. Dari Umm al-\'Ala (radhiyallahu \'anha), ia berkata: Rasulullah ﷺ mengunjungiku saat aku sakit dan berkata: "Bergembiralah, wahai Umm al-\'Ala! Sesungguhnya Allah menghapus dosa Muslim melalui penyakitnya, sebagaimana api menghilangkan kotoran emas dan perak." [Abu Dawud; dinilai hasan oleh al-Mundziri]',ms:'6. Daripada Umm al-\'Ala (radhiyallahu \'anha), beliau berkata: Rasulullah ﷺ melawat aku sewaktu aku sakit dan berkata: "Bergembiralah, wahai Umm al-\'Ala! Sesungguhnya Allah menghapuskan dosa Muslim melalui penyakitnya, seperti api menghilangkan kekotoran emas dan perak." [Abu Dawud; dinilai hasan oleh al-Mundhiri]',tr:'6. Ümmü\'l-Alâ\'dan (radıyallahu anhâ) rivayet edilir, dedi ki: Rasûlullah ﷺ hasta olduğumda beni ziyarete geldi ve dedi: "Müjde sana, ey Ümmü\'l-Alâ! Allah Müslümanın hastalığıyla günahlarını giderir, tıpkı ateşin altın ve gümüşün pisliğini giderdiği gibi." [Ebû Dâvûd; el-Münzirî bunu hasen saymıştır]'}},
{type:'h',text:{ar:'٧ ـ وعن أبي هريرة رضي الله عنه قال: قال رسول الله ﷺ: «ما يزال البلاء بالمؤمن والمؤمنة في نفسه وولده وماله، حتى يلقى الله وما عليه خطيئة» [الترمذي وقال: حسن صحيح].',en:'7. From Abu Hurairah (may Allah be pleased with him), who said: The Messenger of Allah ﷺ said: "Trials never cease to afflict the believing man and woman in themselves, their children and wealth, until they meet Allah with no sin." [Al-Tirmidhi; who said: hasan sahih]',ur:'٧۔ ابو ہریرہ رضی اللہ عنہ سے روایت ہے، انہوں نے کہا: رسول اللہ ﷺ نے فرمایا: «مومن مرد و عورت پر ان کی جان، اولاد اور مال میں مصائب آتے رہتے ہیں یہاں تک کہ بغیر کسی گناہ کے اللہ سے ملے» [ترمذی: حسن صحیح]۔',fa:'٧. از ابوهریره (رضی‌الله‌عنه)، گفت: رسول الله ﷺ فرمود: «پیوسته بلا مومن و مومنه را در جان، فرزند و مالشان می‌آزماید تا خدا را بدون هیچ گناهی ملاقات کنند» [ترمذی: حسن صحیح].',fr:'7. D\'Abu Hurairah (qu\'Allah l\'agrée), qui dit: Le Messager d\'Allah ﷺ dit: «Les épreuves ne cessent d\'affliger le croyant et la croyante dans leur personne, leurs enfants et leurs biens, jusqu\'à ce qu\'ils rencontrent Allah sans péché.» [Al-Tirmidhi; il dit: hasan sahih]',hi:'७. अबू हुरैरा (रज़ियल्लाहु अन्हु) से, उन्होंने कहा: रसूलुल्लाह ﷺ ने फ़रमाया: «मोमिन मर्द और औरत पर उनकी जान, औलाद और माल में बला आती रहती है यहाँ तक कि गुनाहमुक्त होकर अल्लाह से मिलें» [तिर्मिज़ी: हसन सहीह]।',bn:'৭. আবু হুরায়রা (রাযিয়াল্লাহু আনহু) থেকে, তিনি বলেন: রাসূলুল্লাহ ﷺ বলেছেন: «মোমিন পুরুষ ও নারীর উপর তাদের নিজের, সন্তানের ও সম্পদের ক্ষেত্রে মুসীবত আসতে থাকে যতক্ষণ না গুনাহমুক্ত হয়ে আল্লাহর সাথে সাক্ষাৎ করে» [তিরমিযী: হাসান সহীহ]।',id:'7. Dari Abu Hurairah (radhiyallahu \'anhu), ia berkata: Rasulullah ﷺ bersabda: "Cobaan tidak pernah berhenti menimpa mukmin laki-laki dan perempuan dalam diri, anak, dan hartanya, hingga ia bertemu Allah tanpa dosa." [Al-Tirmidzi; berkata: hasan sahih]',ms:'7. Daripada Abu Hurairah (radhiyallahu \'anhu), beliau berkata: Rasulullah ﷺ bersabda: "Ujian tidak pernah berhenti menimpa mukmin lelaki dan perempuan pada diri, anak dan harta mereka, hingga mereka bertemu Allah tanpa dosa." [Al-Tirmizi; berkata: hasan sahih]',tr:'7. Ebû Hüreyre\'den (radıyallahu anh) rivayet edilir, dedi ki: Rasûlullah ﷺ buyurdu: "Sınav, mü\'min erkek ve kadını canlarında, çocuklarında ve mallarında bırakmaz; ta ki Allah\'a günahsız kavuşana dek." [Tirmizî; dedi: hasan sahih]'}},
{type:'h',text:{ar:'٨ ـ وعن سعد بن أبي وقاص رضي الله عنه قال: قال رسول الله ﷺ «ما يبرح البلاء بالعبد حتى يتركه يمشي على الأرض وما عليه خطيئة» [الترمذي وابن ماجه وصححه الألباني].',en:'8. From Sa\'d ibn Abi Waqqas (may Allah be pleased with him), who said: The Messenger of Allah ﷺ said: "Trials do not cease to afflict the servant until they leave him walking on earth with no sin upon him." [Al-Tirmidhi and Ibn Majah; authenticated by Al-Albani]',ur:'٨۔ سعد بن ابی وقاص رضی اللہ عنہ سے روایت ہے، انہوں نے کہا: رسول اللہ ﷺ نے فرمایا: «بندے پر بلا آتی رہتی ہے یہاں تک کہ اسے بغیر کسی گناہ کے زمین پر چلتا چھوڑ دے» [ترمذی، ابن ماجہ، صحیح البانی]۔',fa:'٨. از سعد بن ابی‌وقاص (رضی‌الله‌عنه)، گفت: رسول الله ﷺ فرمود: «بلا از بنده دست برنمی‌دارد تا او را بدون هیچ گناهی روی زمین راه‌رو بگذارد» [ترمذی و ابن‌ماجه؛ الألبانی آن را صحیح دانسته].',fr:'8. De Sa\'d ibn Abi Waqqas (qu\'Allah l\'agrée), qui dit: Le Messager d\'Allah ﷺ dit: «L\'épreuve ne quitte pas le serviteur jusqu\'à ce qu\'elle le laisse marcher sur terre sans péché.» [Al-Tirmidhi et Ibn Majah; authentifié par Al-Albani]',hi:'८. सा\'द बिन अबी वक़\'क़ास (रज़ियल्लाहु अन्हु) से, उन्होंने कहा: रसूलुल्लाह ﷺ ने फ़रमाया: «बंदे पर बला आती रहती है यहाँ तक कि उसे बिना गुनाह के ज़मीन पर चलता छोड़ दे» [तिर्मिज़ी, इब्न माजा; अल्बानी ने सहीह कहा]।',bn:'৮. সা\'দ ইবনে আবী ওয়াক্কাস (রাযিয়াল্লাহু আনহু) থেকে, তিনি বলেন: রাসূলুল্লাহ ﷺ বলেছেন: «বান্দার উপর মুসীবত আসতে থাকে যতক্ষণ না তাকে গুনাহমুক্ত অবস্থায় যমীনে হাঁটতে রেখে যায়» [তিরমিযী ও ইবনে মাজাহ; আলবানী সহীহ বলেছেন]।',id:'8. Dari Sa\'d ibn Abi Waqqas (radhiyallahu \'anhu), ia berkata: Rasulullah ﷺ bersabda: "Cobaan tidak berhenti menimpa hamba hingga meninggalkannya berjalan di bumi tanpa dosa." [Al-Tirmidzi dan Ibnu Majah; disahihkan oleh Al-Albani]',ms:'8. Daripada Sa\'d ibn Abi Waqqas (radhiyallahu \'anhu), beliau berkata: Rasulullah ﷺ bersabda: "Ujian tidak berhenti menimpa hamba hingga meninggalkannya berjalan di bumi tanpa dosa." [Al-Tirmizi dan Ibn Majah; disahihkan oleh Al-Albani]',tr:'8. Sa\'d ibn Ebî Vakkâs\'tan (radıyallahu anh) rivayet edilir, dedi ki: Rasûlullah ﷺ buyurdu: "Sınav kulu bırakmaz; ta ki onu günahsız yeryüzünde yürür halde bırakana dek." [Tirmizî ve İbn Mâce; Elbânî tarafından sahih kabul edilmiştir]'}},
{type:'h',text:{ar:'٩ ـ وعن عائشة رضي الله عنها قالت: سمعت رسول الله ﷺ قال: «ما من مسلم يشاك شوكة فما فوقها إلا كتبت له بها درجة، ومحيت عنه بها خطيئة» [مسلم].',en:'9. From Aisha (may Allah be pleased with her), who said: I heard the Messenger of Allah ﷺ say: "No Muslim is pricked by a thorn or more except that a rank is written for him and a sin erased because of it." [Muslim]',ur:'٩۔ عائشہ رضی اللہ عنہا سے روایت ہے، انہوں نے کہا: میں نے رسول اللہ ﷺ کو سنا فرماتے: «جو مسلمان کانٹے سے یا اس سے بھی کم تکلیف سے متاثر ہو — ایک درجہ لکھا اور ایک گناہ مٹا» [مسلم]۔',fa:'٩. از عائشه (رضی‌الله‌عنها)، گفت: شنیدم رسول الله ﷺ می‌فرمود: «هر مسلمانی که خاری او را بزند یا بیشتر — یک درجه برایش نوشته و گناهی از او محو می‌شود» [مسلم].',fr:'9. D\'Aïcha (qu\'Allah l\'agrée), qui dit: J\'ai entendu le Messager d\'Allah ﷺ dire: «Nul Muslim n\'est piqué par une épine ou plus sans qu\'un rang lui soit inscrit et un péché effacé.» [Muslim]',hi:'९. आयशा (रज़ियल्लाहु अन्हा) से, उन्होंने कहा: मैंने रसूलुल्लाह ﷺ को फ़रमाते सुना: «जो मुसलमान काँटे से या उससे ज़्यादा तकलीफ़ से पीड़ित हो — एक दर्जा लिखा और गुनाह मिटा» [मुस्लिम]।',bn:'৯. আয়িশা (রাযিয়াল্লাহু আনহা) থেকে, তিনি বলেন: আমি রাসূলুল্লাহ ﷺ-কে বলতে শুনেছি: «কাঁটা বা তার চেয়ে বেশি কষ্টে পীড়িত প্রতিটি মুসলিমের জন্য একটি দর্জা লেখা হয় এবং একটি গুনাহ মুছে দেওয়া হয়» [মুসলিম]।',id:'9. Dari Aisha (radhiyallahu \'anha), ia berkata: Aku mendengar Rasulullah ﷺ bersabda: "Tidak ada Muslim yang tertusuk duri atau lebih kecuali ditulis untuknya satu derajat dan dihapus satu dosa karenanya." [Muslim]',ms:'9. Daripada Aishah (radhiyallahu \'anha), beliau berkata: Aku mendengar Rasulullah ﷺ bersabda: "Tidaklah seorang Muslim tertusuk duri atau lebih melainkan ditulis baginya satu darjat dan dihapuskan satu dosa." [Muslim]',tr:'9. Aişe\'den (radıyallahu anhâ) rivayet edilir, dedi ki: Rasûlullah ﷺ\'in şöyle buyurduğunu işittim: "Bir Müslümana diken batar ya da daha fazlası — mutlaka bir derece yazılır ve bir günah silinir." [Müslim]'}},
{type:'h',text:{ar:'١٠ ـ وعن أبي سعيد رضي الله عنه أن رسول الله ﷺ قال: «صداع المؤمن أو شوكة يشاكها، أو شيء يؤذيه، يرفعه الله بها يوم القيامة درجة، ويكفر عنه ذنوبه» [ابن أبي الدنيا وراوته ثقات].',en:'10. From Abu Sa\'id (may Allah be pleased with him): that the Messenger of Allah ﷺ said: "A headache, a thorn prick, or anything that harms the believer — Allah raises him a rank by it on the Day of Resurrection and expiates his sins." [Ibn Abi al-Dunya; narrators are trustworthy]',ur:'١٠۔ ابو سعید رضی اللہ عنہ سے روایت ہے کہ رسول اللہ ﷺ نے فرمایا: «مومن کا سردرد یا کانٹا چبھنا، یا کوئی بھی تکلیف — اللہ اس سے قیامت میں ایک درجہ بلند کرے اور گناہ معاف کرے» [ابن ابی الدنیا؛ راوی ثقات ہیں]۔',fa:'١٠. از ابوسعید (رضی‌الله‌عنه): رسول الله ﷺ فرمود: «سردرد مومن یا خاری که او را بزند، یا چیزی که آزارش دهد — الله با آن روز قیامت یک درجه بالایش می‌برد و گناهانش را می‌آمرزد» [ابن ابی‌الدنیا؛ راویان ثقه‌اند].',fr:'10. D\'Abu Sa\'id (qu\'Allah l\'agrée): que le Messager d\'Allah ﷺ dit: «Un mal de tête, la piqûre d\'une épine, ou quoi que ce soit qui nuit au croyant — Allah l\'élève d\'un rang le Jour de la Résurrection et expie ses péchés.» [Ibn Abi al-Dunya; narrateurs dignes de confiance]',hi:'१०. अबू सईद (रज़ियल्लाहु अन्हु) से कि रसूलुल्लाह ﷺ ने फ़रमाया: «मोमिन का सिरदर्द या काँटा चुभना, या कोई भी तकलीफ़ — अल्लाह इससे क़यामत में एक दर्जा बुलंद करेगा और गुनाह माफ़ करेगा» [इब्न अबी अद्-दुन्या; रावी सिक़ात]।',bn:'১০. আবু সাঈদ (রাযিয়াল্লাহু আনহু) থেকে: রাসূলুল্লাহ ﷺ বলেছেন: «মোমিনের মাথাব্যথা বা কাঁটার আঘাত, বা তাকে কষ্ট দেয় এমন কিছু — আল্লাহ কিয়ামতে তার মাধ্যমে এক দর্জা উঁচু করবেন এবং গুনাহ মাফ করবেন» [ইবনে আবিদ-দুনিয়া; রাবীরা নির্ভরযোগ্য]।',id:'10. Dari Abu Sa\'id (radhiyallahu \'anhu): bahwa Rasulullah ﷺ bersabda: "Sakit kepala, duri yang menusuk, atau apa pun yang menyakiti mukmin — Allah mengangkatnya satu derajat di Hari Kiamat karenanya dan mengampuni dosanya." [Ibnu Abi al-Dunya; periwayat-periwayatnya terpercaya]',ms:'10. Daripada Abu Sa\'id (radhiyallahu \'anhu): bahawa Rasulullah ﷺ bersabda: "Sakit kepala, tusukan duri, atau apa sahaja yang menyakiti mukmin — Allah mengangkatnya satu darjat pada Hari Kiamat dan mengampunkan dosanya." [Ibn Abi al-Dunya; perawi-perawinya dipercayai]',tr:'10. Ebû Saîd\'den (radıyallahu anh): Rasûlullah ﷺ\'in şöyle buyurduğu rivayet edilir: "Mü\'minin baş ağrısı ya da batan diken ya da ona zarar veren her şey — Allah kıyamet gününde bununla onu bir derece yükseltir ve günahlarını bağışlar." [İbn Ebî\'d-Dünyâ; ravileri güvenilirdir]'}},
{type:'r',text:{ar:'أخي المريض: ألا فاحمد الله على هذه النعمة التي أنعم الله بها عليك، ليكفر بها عنك ذنوبك، ويزيد لك في حسناتك، ويرفع بها درجاتك. إن من فوائد المرض أنه يبين للإنسان ضعفه وفقره إلى ربه الغني، فيلجأ إليه بعد أن كان غافلاً، ويترك مبارزته بالمعاصي. اللهم اشف مرضانا شفاءً لا يغادر سقماً، وألبسهم ثوب الصحة والعافية.',en:'Dear patient: Praise Allah for this blessing — by which He expiates your sins, multiplies your good deeds, and elevates your ranks. Among illness\'s benefits: it reveals a person\'s weakness and need for his Lord, turning him to Allah after heedlessness, and away from sin. O Allah, heal our sick with a complete healing that leaves no illness, and clothe them in health and well-being.',ur:'اخی المریض: اللہ کا شکر ادا کریں — جس سے گناہ مٹیں، نیکیاں بڑھیں اور درجات بلند ہوں۔ بیماری میں یہ فائدہ بھی ہے کہ انسان اپنی کمزوری اور رب کی محتاجگی سمجھتا ہے اور غفلت چھوڑ کر اس کی طرف لوٹتا ہے۔ اللہم ہمارے مریضوں کو مکمل شفا دے۔',fa:'برادر بیمار: الله را حمد کن — که گناهانت را می‌بخشد، حسناتت را می‌افزاید و درجاتت را بالا می‌برد. بیماری ضعف انسان و نیاز به پروردگارش را آشکار می‌کند. اللهم مریضانمان را شفای کامل ده.',fr:'Cher malade: Loue Allah pour cette grâce — par laquelle Il expie tes péchés, multiplie tes bonnes actions et élève tes rangs. La maladie révèle la faiblesse de l\'homme et son besoin de son Seigneur. Ô Allah, guéris nos malades d\'une guérison complète.',hi:'प्रिय मरीज़: अल्लाह का शुक्र अदा करें — जिससे गुनाह माफ़, नेकियाँ बढ़ें और दर्जात बुलंद हों। बीमारी से इंसान को अपनी कमज़ोरी और रब की मोहताजगी का एहसास होता है। अल्लाहुम्मा मरीज़ों को मुकम्मल शिफा दे।',bn:'প্রিয় রোগী: আল্লাহর শুকরিয়া — যার মাধ্যমে গুনাহ মাফ, নেকি বৃদ্ধি ও মর্যাদা উন্নত হয়। বীমারী দুর্বলতা ও রবের মুখাপেক্ষিতা বুঝিয়ে দেয়। হে আল্লাহ আমাদের রোগীদের পূর্ণ সুস্থতা দিন।',id:'Saudara yang sakit: Bersyukurlah kepada Allah — dengannya Dia menghapus dosamu, menambah kebaikanmu, dan meninggikan derajatmu. Sakit memperlihatkan kelemahan manusia dan kebutuhannya kepada Rabb-nya. Ya Allah, sembuhkan orang-orang sakit kami dengan kesembuhan yang sempurna.',ms:'Saudara yang sakit: Bersyukurlah kepada Allah — dengannya Dia menghapus dosamu, menambah kebaikanmu, dan meninggikan darjatmu. Sakit memperlihatkan kelemahan manusia dan keperluannya kepada Rabb-nya. Ya Allah, sembuhkan orang sakit kami dengan kesembuhan yang sempurna.',tr:'Sevgili hasta: Allah\'a bu nimet için şükret — bununla günahlarını bağışlar, iyiliklerini artırır ve derecelerini yükseltir. Hastalık insanın zayıflığını ve Rabbine muhtaçlığını gösterir. Allah\'ım, hastalarımıza hiçbir hastalık bırakmayan tam bir şifa ver.'}}
,{type:'r',text:{ar:'وماذا يفيدك الجزع والتسخط والتشكي؟! إن ذلك لن يفيدك شيئاً، بل هو يزيد عليك الألم والضعف والتعب أضعاف ما لو كنت صابراً محتسباً. ومن فوائد المرض والبلاء أيضاً أنه يريك نعم الله عليك كما لم ترها من قبل، ففي حال المرض يشعر الإنسان شعوراً حقيقياً بنعمة الصحة، ويشعر بتفريطه في هذه النعمة التي أنعم الله بها عليه سنين طوالاً، ومن ثم يعاهد ربه أن يكون شاكراً على النعماء صابراً على البلاء. لا أريد أن أطيل عليك في هذا المقام، ويكفي ما سقته إليك من صحاح الأحاديث في فوائد المرض والبلاء للمؤمن الصابر.',en:'What good is distress, resentment, and complaint?! These will benefit you nothing — rather they multiply your pain and exhaustion many times more than if you were patient and hopeful of reward. Among illness\'s further benefits: it shows you Allah\'s blessings upon you as you never saw them before. During illness one truly feels the blessing of health, and realizes his negligence toward this gift which Allah gave him for long years. He then renews his covenant to be grateful for blessings and patient through trials. I do not wish to prolong this — what I have shared of authentic hadiths on the benefits of illness and trials for the patient believer is sufficient.',ur:'جزع، تسخط اور شکایت سے کیا فائدہ؟! یہ کچھ کام نہ آئے گا، بلکہ صبر سے کئی گنا زیادہ درد اور تعب بڑھا دیتا ہے۔ بیماری کا ایک فائدہ یہ بھی ہے کہ اللہ کی نعمتیں جیسے پہلے نہ دیکھی تھیں ویسے نظر آنے لگتی ہیں۔ بیماری میں صحت کی نعمت کا حقیقی احساس ہوتا ہے۔ پھر عہد کرتا ہے کہ آئندہ شاکر رہے اور بلا پر صابر۔ مزید طوالت مناسب نہیں — جو صحاح احادیث میں فضل مرض وبلاء کے بارے میں پیش کیا وہی کافی ہے۔',fa:'جزع و تسخط و شکایت چه سودی دارد؟! هیچ! بلکه چند برابر بیشتر از صبر، درد و خستگی اضافه می‌شود. از فوائد بیماری آنکه نعمت‌های الله را آن‌چنان که پیشتر نمی‌دیدی نشانت می‌دهد. در حال بیماری نعمت سلامتی واقعی احساس می‌شود. سپس عهد می‌کند که شاکر و صابر باشد. مایل نیستم بیشتر بپردازم — احادیث صحیحی که در فضل بیماری ذکر کردم کافی است.',fr:'À quoi sert l\'agitation, la rancœur et la plainte?! Cela ne t\'apportera rien — bien au contraire, cela multipliera ta douleur et ta fatigue par rapport à ce que tu ressentirais si tu étais patient. Parmi les bienfaits de la maladie: elle te fait voir les grâces d\'Allah comme tu ne les as jamais vues. Dans la maladie, on ressent vraiment la grâce de la santé et la négligence envers ce don. On renouvelle alors son engagement d\'être reconnaissant et patient. Je ne souhaite pas prolonger — ce que j\'ai partagé des hadiths authentiques suffit.',hi:'जज़ा, तसख्खुत और शिकायत से क्या फ़ायदा?! यह कुछ काम न आएगा — बल्कि सब्र से कई गुना ज़्यादा दर्द और थकान बढ़ाएगा। बीमारी का एक फ़ायदा यह भी है कि अल्लाह की नेमतें पहले से बेहतर नज़र आती हैं। बीमारी में सेहत की नेमत का असली एहसास होता है। फिर आदमी एहद करता है कि आगे शुक्रगुज़ार और सब्र वाला रहेगा। यहाँ लंबाई मुनासिब नहीं — सहीह अहादीस में जो पेश किया वो काफ़ी है।',bn:'ব্যাকুলতা, বিরক্তি ও অভিযোগে কী লাভ?! এতে কিছু হবে না — বরং ধৈর্যশীল হলে যতটুকু কষ্ট হতো তার চেয়ে বহুগুণ বেশি বাড়বে। রোগের আরেকটি উপকার: আল্লাহর নেয়ামত যেভাবে আগে দেখোনি সেভাবে দেখাবে। রোগে সুস্বাস্থ্যের নেয়ামত সত্যিকার অনুভব হয়। তখন প্রতিজ্ঞা করে শোকরগুজার ও ধৈর্যশীল থাকবে। এখানে দীর্ঘ করা ঠিক নয় — সহীহ হাদীসে যা এসেছে তাই যথেষ্ট।',id:'Apa manfaat gelisah, kesal, dan mengeluh?! Itu tidak akan memberimu apa pun — bahkan melipatgandakan rasa sakit dan kelelahan jauh melebihi jika kamu bersabar. Di antara manfaat penyakit: ia memperlihatkan nikmat Allah kepadamu yang tidak pernah kamu lihat sebelumnya. Dalam sakit, seseorang benar-benar merasakan nikmat kesehatan dan menyadari kelalaiannya. Lalu ia berjanji untuk bersyukur dan bersabar. Saya tidak ingin memperpanjang — apa yang telah saya sampaikan dari hadits sahih sudah cukup.',ms:'Apa manfaat resah, marah, dan mengeluh?! Ia tidak akan memberi apa-apa — bahkan melipatgandakan kesakitan dan keletihan jauh melebihi jika kamu bersabar. Antara manfaat sakit: ia memperlihatkan nikmat Allah kepadamu yang tidak pernah kamu lihat sebelum ini. Dalam sakit, seseorang benar-benar merasai nikmat kesihatan dan menyedari kecuaiannya. Lalu dia berjanji untuk bersyukur dan bersabar. Saya tidak mahu memanjangkan — apa yang telah saya sampaikan sudah mencukupi.',tr:'Bunaltı, öfke ve şikayetin faydası ne?! Bunlar hiçbir işe yaramaz — üstelik sabretseydin duyacağın acı ve yorgunluğun katlarını yaşatır. Hastalığın bir başka faydası: Allah\'ın nimetlerini daha önce görmediğin şekilde gösterir. Hastalık anında sağlık nimetini gerçekten hisseder, uzun yıllar ihmal ettiğini anlar. Sonra şükreden ve belalara sabreden biri olmaya söz verir. Burada daha fazla uzatmak istemiyorum — sahih hadislerden aktardıklarım yeterlidir.'}}
,{type:'v',text:{ar:'وفي الختام، تتقدم إدارة مستشفى ينبع العام بخالص الدعاء لمرضانا الكرام، سائلين الله عز وجل أن يمنّ عليهم بالشفاء العاجل، وأن يرفع عنهم البلاء، وأن يجعل ما أصابهم رفعةً في درجاتهم وتكفيراً لسيئاتهم. اللهم اشف مرضانا شفاءً لا يغادر سقماً، وألبسهم ثوب الصحة والعافية، واجعل لهم من كل هم فرجاً، ومن كل ضيق مخرجاً. كما نسأل الله أن يبارك في جهود الكوادر الصحية، وأن يجعلهم سبباً في شفاء المرضى وخدمتهم.',en:'In conclusion, Yanbu General Hospital Administration extends its sincere prayers for our esteemed patients, asking Allah ﷻ to bless them with swift recovery, lift their affliction, and make their trials a means of elevation in their ranks and expiation of their sins. O Allah, heal our patients with a healing that leaves no illness, clothe them in the garment of health and well-being, grant them relief from every distress and a way out from every difficulty. We also ask Allah to bless the efforts of the medical staff and make them a means of the patients\' healing and service.',ur:'خاتمے میں، مستشفی ینبع العام انتظامیہ اپنے عزیز مریضوں کے لیے خالص دعا پیش کرتی ہے، اللہ سے التجا کرتے ہوئے کہ جلد شفا دے، بلا اٹھائے، اور جو تکلیف پہنچی وہ درجات میں بلندی اور گناہوں کا کفارہ بنائے۔ اللہم ہمارے مریضوں کو ایسی شفا دے جو کوئی بیماری نہ چھوڑے، صحت کا لباس پہنائے، ہر تنگی سے فرج اور مخرج عطا فرما۔ نیز طبی عملے کی کوششوں میں برکت دے اور انہیں مریضوں کی شفاء کا سبب بنائے۔',fa:'در پایان، مدیریت بیمارستان عام ینبع صمیمانه‌ترین دعا را برای بیماران گرامی تقدیم می‌کند، از الله می‌خواهیم که بهبودی سریع نصیبشان فرماید، بلا را از آنان بردارد و آنچه به آنان رسیده را موجب رفعت درجاتشان و کفاره گناهانشان قرار دهد. خداوندا، بیمارانمان را با شفایی که هیچ دردی باقی نگذارد شفا ده، جامه سلامت بپوشان، از هر غم گشایش و از هر تنگنا راه خروج عطا فرما. همچنین در تلاش‌های کادر درمانی برکت عطا فرما و آنان را سبب بهبودی بیماران قرار ده.',fr:'En conclusion, la direction de l\'Hôpital Général de Yanbu présente ses sincères prières pour ses estimés patients, demandant à Allah ﷻ de leur accorder une guérison rapide, de soulever leur épreuve, et de faire de leurs souffrances une élévation de leur rang et une expiation de leurs péchés. Ô Allah, guéris nos malades d\'une guérison qui ne laisse aucune maladie, revêts-les du vêtement de la santé, accorde-leur soulagement et issue de toute difficulté. Nous demandons aussi à Allah de bénir les efforts du personnel médical et d\'en faire un moyen de guérison pour les malades.',hi:'अंत में, यानबू जनरल हॉस्पिटल प्रशासन अपने माननीय मरीज़ों के लिए खालिस दुआ पेश करता है, अल्लाह से विनती करते हुए कि जल्द शिफा दे, बला हटाए, और जो तकलीफ पहुंची वह दर्जात में बुलंदी और गुनाहों का कफ्फारा बने। अल्लाहुम्मा मरीज़ों को ऐसी शिफा दे जो कोई बीमारी न छोड़े, सेहत का लिबास पहनाए, हर तंगी से फरज और मख़रज दे। और मेडिकल स्टाफ की मेहनत में बरकत दे और उन्हें मरीज़ों की शिफा का सबब बनाए।',bn:'পরিশেষে, ইয়ানবু জেনারেল হাসপাতাল প্রশাসন তাদের সম্মানিত রোগীদের জন্য আন্তরিক দোয়া পেশ করছে, আল্লাহর কাছে প্রার্থনা করছে যেন তাদের শীঘ্র আরোগ্য দিন, বিপদ দূর করুন এবং যা ঘটেছে তা মর্যাদা বৃদ্ধির ও গুনাহ মোচনের উপায় করুন। হে আল্লাহ, রোগীদের এমন সুস্থতা দিন যা কোনো রোগ না রাখে, সুস্বাস্থ্যের পোশাক পরিয়ে দিন, প্রতিটি উদ্বেগ থেকে স্বস্তি ও সংকট থেকে মুক্তি দিন। চিকিৎসা কর্মীদের প্রচেষ্টায় বরকত দিন এবং তাদের রোগীদের সুস্থতার কারণ করুন।',id:'Sebagai penutup, manajemen Rumah Sakit Umum Yanbu menyampaikan doa tulus untuk pasien-pasien terhormat kami, memohon kepada Allah ﷻ untuk menganugerahi mereka kesembuhan segera, mengangkat ujian dari mereka, dan menjadikan apa yang menimpa mereka sebagai peningkatan derajat dan penghapus dosa. Ya Allah, sembuhkan pasien kami dengan kesembuhan yang tidak menyisakan penyakit, pakaikanlah pakaian kesehatan dan afiat, berikanlah jalan keluar dari setiap kesusahan. Kami juga memohon kepada Allah untuk memberkahi upaya tenaga kesehatan dan menjadikan mereka sarana kesembuhan bagi pasien.',ms:'Sebagai penutup, pihak pengurusan Hospital Umum Yanbu menyampaikan doa yang tulus untuk pesakit-pesakit mulia kami, memohon kepada Allah ﷻ agar mengurniakan mereka kesembuhan yang segera, mengangkat ujian dari mereka, dan menjadikan apa yang menimpa mereka sebagai peningkatan darjat dan penghapus dosa. Ya Allah, sembuhkan pesakit kami dengan kesembuhan yang tidak menyisakan penyakit, pakaikanlah pakaian kesihatan dan afiaat, berikanlah jalan keluar dari setiap kesempitan. Kami juga memohon agar memberkahi usaha tenaga perubatan dan menjadikan mereka sebab kesembuhan pesakit.',tr:'Son olarak, Yanbu Genel Hastanesi yönetimi, değerli hastalarımız için en içten duasını sunar; Allah ﷻ\'tan onlara acil şifa vermesini, belalarını kaldırmasını ve başlarına gelenleri derece yükseltmesi ve günahlarına kefaret yapmasını diler. Allah\'ım, hastalarımıza hiçbir hastalık bırakmayan tam bir şifa ver, sağlık ve afiyet libasıyla giydir, her sıkıntıdan bir çıkış ve her darlıktan bir kurtuluş ver. Sağlık personelinin çabalarını bereketli kılmanı ve onları hastaların şifasına vesile etmeni de dileriz.'}}
]}
]/*TOPICS_END*/;

/* ====== NAVIGATION ====== */
function show(id){['s1','s2','s3'].forEach(s=>{
  const el=document.getElementById(s);
  el.classList.toggle('on',s===id);
});
const r=document.getElementById('root');
r.setAttribute('lang',CL);
r.setAttribute('dir',LG[CL].d);
}
function goLang(){show('s1')}
function goTop(){show('s2')}
function selLang(l){CL=l;buildS2();show('s2')}
function selTop(i){CT=i;buildS3();show('s3')}

/* ====== FONT & CONTRAST ====== */
function adjF(d){FL=Math.max(0,Math.min(2,FL+d));
const sz=['0.875rem','1rem','1.2rem'][FL];
document.documentElement.style.setProperty('--fz',sz);}
function togHC(){HC=!HC;
document.getElementById('root').toggleAttribute('data-hc',HC);
document.getElementById('hcb').classList.toggle('on',HC);}

/* ====== BUILD SCREENS ====== */
function buildS1(){
  const g=document.getElementById('lgr');
  g.innerHTML=Object.entries(LG).map(([k,v])=>
    `<button class="lb" onclick="selLang('${k}')" role="listitem" aria-label="${v.n}">
      <span class="lf">${v.f}</span><span class="ln">${v.n}</span>
    </button>`).join('');
}
function buildS2(){
  document.getElementById('s2t').textContent=
    {ar:'المواضيع',ur:'موضوعات',fa:'موضوعات',en:'Topics',fr:'Sujets',hi:'विषय',bn:'বিষয়',id:'Topik',ms:'Topik',tr:'Konular'}[CL]||'Topics';
  const tl=document.getElementById('tl');
  tl.innerHTML=TP.map((t,i)=>
    `<div class="tc" onclick="selTop(${i})" role="listitem" tabindex="0"
       aria-label="${t.title[CL]||t.title.ar}"
       onkeydown="if(event.key==='Enter'||event.key===' ')selTop(${i})">
      <div class="tic">${t.icon}</div>
      <div class="tn">${i+1}</div>
      <div class="ti"><div class="tt">${t.title[CL]||t.title.ar}</div></div>
      <div class="ta">›</div>
    </div>`).join('');
}
function buildS3(){
  const t=TP[CT];
  document.getElementById('s3t').textContent=t.title[CL]||t.title.ar;
  const cb=document.getElementById('cb');
  cb.innerHTML=t.blocks.map((b,bi)=>{
    let txt=b.text[CL]||b.text.ar;
    if(b.type==='v') return `<div class="pv" id="b${bi}">${txt}</div>`;
    if(b.type==='h') return `<div class="ph" id="b${bi}">${txt}</div>`;
    if(b.type==='r') txt=txt.replace(/([.»۔])\s+([١-٩۰-۹१-९১-৯\d]+[ـ.۔])/g,'$1<br><br>$2');
    return `<p class="pp" id="b${bi}">${txt}</p>`;
  }).join('');
}

/* ====== INIT ====== */
buildS1();
</script>
